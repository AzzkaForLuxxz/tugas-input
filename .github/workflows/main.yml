
name: Compile C++ to EXE

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Compile C++
        run: g++ main.cpp -o tugas.exe -std=c++17

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: tugas-exe
          path: tugas.exe
